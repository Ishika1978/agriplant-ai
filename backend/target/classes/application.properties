# ===================== Server =====================
server.port=8080

# ===================== MySQL datasource =====================
# Matches database/schema.sql — create the DB first (see README), then
# start the app; Hibernate validates the schema against the entities.
spring.datasource.url=jdbc:mysql://localhost:3306/agriplant_ai?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=Ishika@1978
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false

# ===================== AI microservice =====================
# Base URL of the Python Flask CNN inference service (see /ai-service)
ai.service.base-url=http://localhost:5000

# ===================== Optional dynamic translation =====================
translation.provider=libretranslate
translation.libretranslate.url=http://localhost:5001/translate
translation.libretranslate.api-key=

# ===================== JWT auth =====================
security.jwt.secret=CHANGE_ME_TO_A_LONG_RANDOM_SECRET
security.jwt.expiration-ms=86400000

# ===================== File upload =====================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.upload.dir=./uploads/leaf-photos

# ===================== CORS =====================
# The frontend is served separately (static file or another host), so the
# browser needs the API to allow its origin. Narrow this in production.
app.cors.allowed-origins=*

