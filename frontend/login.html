
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AgriPlant AI - Login</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      background: #eef5e9;
    }
    .login {
      background: white;
      padding: 35px;
      border-radius: 15px;
      width: 320px;
      box-shadow: 0 5px 20px #0002;
    }
    h2 { color: #2e6b38; text-align: center; }
    input, button {
      box-sizing: border-box;
      width: 100%;
      padding: 12px;
      margin-top: 15px;
      border-radius: 7px;
    }
    input { border: 1px solid #ccc; }
    button {
      background: #2e6b38;
      color: white;
      border: none;
      cursor: pointer;
    }
    #message { color: #c62828; text-align: center; }
  </style>
</head>
<body>
  <form class="login" id="loginForm">
    <h2>🌱 AgriPlant AI</h2>
    <p style="text-align:center">Login to your account</p>
    <button type="button"
        onclick="window.location.href='/oauth2/authorization/google'"
        style="background:white;color:#333;border:1px solid #ccc;">
    🌐 Sign in with Google
</button>

  <p style="text-align:center">— OR LOGIN WITH EMAIL —</p>
    <input type="email" id="email" placeholder="Email address" required>
    <input type="password" id="password" placeholder="Password" required>
    <button type="submit">Login</button>
    <p id="message"></p>
  </form>

  

<script>
document.getElementById("loginForm").addEventListener("submit", function(e) {
    e.preventDefault();

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    if (email && password) {
        sessionStorage.setItem("userName", email.split("@")[0]);
        window.location.href = "/index.html";
    }
});
</script>


</body>
</html>
